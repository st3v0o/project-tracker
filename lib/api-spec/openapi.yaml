openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Project Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tickets
    description: Ticket management
  - name: ai
    description: AI-powered features
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /tickets:
    get:
      operationId: listTickets
      tags: [tickets]
      summary: List all tickets
      parameters:
        - name: state
          in: query
          schema:
            type: string
        - name: submitter
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"
    post:
      operationId: createTicket
      tags: [tickets]
      summary: Create a new ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTicketRequest"
      responses:
        "201":
          description: Created ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
  /tickets/{id}:
    get:
      operationId: getTicket
      tags: [tickets]
      summary: Get a ticket by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateTicket
      tags: [tickets]
      summary: Update a ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTicketRequest"
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTicket
      tags: [tickets]
      summary: Delete a ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tickets/export:
    get:
      operationId: exportTickets
      tags: [tickets]
      summary: Export tickets as an Excel file
      parameters:
        - name: state
          in: query
          schema:
            type: string
        - name: submitter
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
          description: Free-text search on title or submitter
      responses:
        "200":
          description: Excel file download
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /tickets/parse-image:
    post:
      operationId: parseTicketImage
      tags: [ai]
      summary: Parse a screenshot to extract ticket fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseImageRequest"
      responses:
        "200":
          description: Extracted ticket fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseImageResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Ticket:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        state:
          type: string
          description: US state name (e.g. Virginia, Texas)
        submitter:
          type: string
          description: Name of the person who submitted the ticket
        category:
          type: string
          description: Work category (e.g. Power Automate, ArcGIS, CRM, Dashboard)
        status:
          type: string
          enum: [todo, pending, complete]
          description: todo = for today, pending = carried over, complete = done
        pendingDate:
          type: string
          format: date
          nullable: true
          description: The date this ticket was marked pending for
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: When the ticket was completed
        submittedAt:
          type: string
          format: date-time
          description: When the ticket was submitted
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - description
        - state
        - submitter
        - category
        - status
        - submittedAt
        - createdAt
        - updatedAt

    CreateTicketRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        state:
          type: string
        submitter:
          type: string
        category:
          type: string
        status:
          type: string
          enum: [todo, pending, complete]
          default: todo
        submittedAt:
          type: string
          format: date-time
      required:
        - title
        - description
        - state
        - submitter
        - category

    UpdateTicketRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        state:
          type: string
        submitter:
          type: string
        category:
          type: string
        status:
          type: string
          enum: [todo, pending, complete]
        pendingDate:
          type: string
          nullable: true
        completedAt:
          type: string
          nullable: true
          description: ISO 8601 date-time string
        submittedAt:
          type: string
          description: ISO 8601 date-time string

    ParseImageRequest:
      type: object
      properties:
        imageBase64:
          type: string
          description: Base64-encoded image data (with or without data URI prefix)
        mimeType:
          type: string
          description: Image MIME type (e.g. image/png, image/jpeg)
      required:
        - imageBase64

    ParseImageResponse:
      type: object
      properties:
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        submitter:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        confidence:
          type: string
          nullable: true
          description: Brief note about extraction confidence
      required:
        - title
        - description
        - submitter
        - state
        - category
        - confidence

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
