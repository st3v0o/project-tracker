packages:
  "date-fns": "For human-readable relative time and date formatting"
  "react-hook-form": "For robust form state management"
  "@hookform/resolvers": "For Zod schema validation with forms"
  "framer-motion": "For polished page and list animations"
  "clsx": "For conditional class merging"
